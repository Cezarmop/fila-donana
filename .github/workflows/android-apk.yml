name: APK Android (teste)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # O runner ubuntu-latest do GitHub já vem com o Android SDK instalado (ANDROID_HOME).
      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: fila-donana-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publica o APK numa versão (Release) fixa "apk-teste", para baixar direto pelo celular.
      - name: Publicar APK na Release apk-teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk fila-donana-teste.apk
          gh release view apk-teste >/dev/null 2>&1 || \
            gh release create apk-teste --prerelease --title "APK de teste" \
              --notes "APK de teste (assinado com chave de debug). Gerado automaticamente a cada mudança em android/."
          gh release upload apk-teste fila-donana-teste.apk --clobber
