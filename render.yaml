# Blueprint do Render: cria o banco PostgreSQL e o serviço web (API + site) de uma vez.
# No painel do Render: New > Blueprint > escolha este repositório.
# Confira os planos/limites gratuitos atuais em https://render.com/docs/free
databases:
  - name: fila-donana-db
    plan: free
    databaseName: fila_donana
    user: fila

services:
  - type: web
    name: fila-donana
    runtime: node
    plan: free
    buildCommand: >-
      cd web && npm ci && npm run build &&
      cd ../server && npm ci --include=dev && npm run build
    startCommand: cd server && npm run start:prod
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: fila-donana-db
          property: connectionString
      - key: PAINEL_SENHA
        sync: false # o Render pede o valor ao criar o Blueprint
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_URL
        value: https://donana.cezbyte.com.br
      - key: VITE_PUBLIC_URL
        value: https://donana.cezbyte.com.br
      - key: RESTAURANTE_NOME
        value: Restaurante & Churrascaria Don'Ana
      - key: WHATSAPP_MODO
        value: link
    domains:
      - donana.cezbyte.com.br
